<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenDiary 🍃 | Calm Student Journal & Note-Maker</title>
  <!-- Google Fonts: Outfit for UI, Lora for Journaling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-emoji">🍃</span>
          <h1 class="logo-text">ZenDiary</h1>
        </div>
        <button class="toggle-sidebar-btn" id="collapse-sidebar-btn" aria-label="Collapse sidebar">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
        </button>
      </div>

      <!-- Quick Stats / Quote Card -->
      <div class="quote-card">
        <p class="quote-text" id="quote-text">"The secret of getting ahead is getting started."</p>
        <span class="quote-author" id="quote-author">— Mark Twain</span>
      </div>

      <!-- Action Button -->
      <button class="btn btn-primary new-entry-btn" id="new-entry-btn">
        <svg class="icon icon-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Write New Entry
      </button>

      <!-- Search and Filter Panel -->
      <div class="search-filter-panel">
        <div class="search-box">
          <svg class="icon icon-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Search entries...">
        </div>
        
        <div class="filters">
          <select id="category-filter" class="select-input">
            <option value="">All Categories</option>
            <option value="Personal">Personal</option>
            <option value="Class Notes">Class Notes</option>
            <option value="Study">Study</option>
            <option value="Reminders">Reminders</option>
            <option value="Gratitude">Gratitude</option>
            <option value="Ideas">Ideas</option>
          </select>

          <select id="mood-filter" class="select-input">
            <option value="">All Moods</option>
            <option value="Calm">🍃 Calm</option>
            <option value="Focused">🎯 Focused</option>
            <option value="Happy">☀️ Happy</option>
            <option value="Tired">☁️ Tired</option>
            <option value="Anxious">🌊 Anxious</option>
          </select>
        </div>
      </div>

      <!-- Journal Entry List -->
      <div class="entries-list-container">
        <div class="section-title">My Journal Entries (<span id="entry-count">0</span>)</div>
        <div class="entries-list" id="entries-list">
          <!-- Dynamically populated entries -->
          <div class="no-entries">No journal entries yet. Tap above to write your first page!</div>
        </div>
      </div>

      <!-- Calm Tools Section (Pomodoro & Sounds) -->
      <div class="sidebar-tools">
        <!-- Pomodoro Card -->
        <div class="tool-card pomodoro-card">
          <div class="tool-header">
            <h3>Focus Timer</h3>
            <span class="timer-mode-badge" id="timer-mode">Study</span>
          </div>
          <div class="pomodoro-display-container">
            <svg class="progress-ring" width="80" height="80">
              <circle class="progress-ring__circle-bg" stroke="#EBE5DC" stroke-width="4" fill="transparent" r="34" cx="40" cy="40"/>
              <circle class="progress-ring__circle" id="timer-progress" stroke="#8E9F88" stroke-width="4" fill="transparent" r="34" cx="40" cy="40"/>
            </svg>
            <div class="timer-countdown" id="timer-countdown">25:00</div>
          </div>
          <div class="timer-controls">
            <button class="btn btn-icon" id="timer-play-pause" aria-label="Play or pause timer">
              <svg class="icon" viewBox="0 0 24 24"><path id="play-pause-path" d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn btn-icon" id="timer-reset" aria-label="Reset timer">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
          </div>
          <div class="timer-presets">
            <button class="btn btn-chip active" data-time="25" data-mode="Study">25m Study</button>
            <button class="btn btn-chip" data-time="5" data-mode="Short Break">5m Break</button>
            <button class="btn btn-chip" data-time="15" data-mode="Long Break">15m Break</button>
          </div>
        </div>

        <!-- Soundscape Panel -->
        <div class="tool-card sound-card">
          <h3>Ambient Audio</h3>
          <div class="sound-toggles">
            <button class="btn btn-chip sound-btn" data-sound="rain">
              <span class="btn-emoji">🌧️</span> Rain
            </button>
            <button class="btn btn-chip sound-btn" data-sound="wind">
              <span class="btn-emoji">🍃</span> Forest Wind
            </button>
            <button class="btn btn-chip sound-btn" data-sound="noise">
              <span class="btn-emoji">🌊</span> Brown Noise
            </button>
          </div>
          <div class="volume-slider-container">
            <svg class="icon icon-volume" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
            <input type="range" id="ambient-volume" min="0" max="1" step="0.05" value="0.5" aria-label="Ambient volume">
          </div>
        </div>
      </div>

      <!-- Backup / Portability Actions -->
      <div class="sidebar-footer">
        <button class="btn btn-text" id="export-json-btn" title="Export all diary data to JSON">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
          Export Backup
        </button>
        <button class="btn btn-text" id="import-json-trigger" title="Import diary data from JSON">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v-4h-4v4H7l5 5 5-5h-3z"/></svg>
          Import Backup
        </button>
        <input type="file" id="import-json-file" accept=".json" style="display: none;">
      </div>
    </aside>

    <!-- Sidebar Toggle Button (Floating when collapsed) -->
    <button class="toggle-sidebar-btn floating-toggle-btn" id="expand-sidebar-btn" aria-label="Expand sidebar">
      <svg class="icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
    </button>

    <!-- Main Workspace (Editor Panel) -->
    <main class="editor-panel">
      <!-- Editor Header -->
      <header class="editor-header">
        <div class="editor-meta">
          <div class="date-time-picker-wrapper">
            <span class="calendar-icon">📅</span>
            <input type="datetime-local" id="entry-datetime" class="meta-datetime-input">
          </div>
          <span class="autosave-badge" id="autosave-badge">Draft autosaved</span>
        </div>
        
        <div class="editor-controls-row">
          <!-- Title Input -->
          <input type="text" id="entry-title" class="editor-title-input" placeholder="Title of your day..." autocomplete="off">
        </div>

        <div class="editor-selectors-row">
          <!-- Category Selector -->
          <div class="selector-group">
            <label for="entry-category">Category</label>
            <select id="entry-category" class="select-input elegant-select">
              <option value="Personal">Personal</option>
              <option value="Class Notes">Class Notes</option>
              <option value="Study">Study</option>
              <option value="Reminders">Reminders</option>
              <option value="Gratitude">Gratitude</option>
              <option value="Ideas">Ideas</option>
            </select>
          </div>

          <!-- Mood Selector -->
          <div class="selector-group">
            <label>Mood today</label>
            <div class="mood-selector" id="mood-selector">
              <button class="mood-btn-option" data-mood="Calm" title="Calm">
                <span class="mood-emoji">🍃</span> <span class="mood-label">Calm</span>
              </button>
              <button class="mood-btn-option" data-mood="Focused" title="Focused">
                <span class="mood-emoji">🎯</span> <span class="mood-label">Focused</span>
              </button>
              <button class="mood-btn-option" data-mood="Happy" title="Happy">
                <span class="mood-emoji">☀️</span> <span class="mood-label">Happy</span>
              </button>
              <button class="mood-btn-option" data-mood="Tired" title="Tired">
                <span class="mood-emoji">☁️</span> <span class="mood-label">Tired</span>
              </button>
              <button class="mood-btn-option" data-mood="Anxious" title="Anxious">
                <span class="mood-emoji">🌊</span> <span class="mood-label">Anxious</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Editor Writing Pad -->
      <section class="editor-body">
        <textarea id="entry-content" class="editor-textarea" placeholder="Start writing here... Let your thoughts flow."></textarea>
      </section>

      <!-- Editor Footer Status / Portability -->
      <footer class="editor-footer">
        <div class="footer-stats">
          <span class="stat-item"><strong id="word-count">0</strong> words</span>
          <span class="stat-item"><strong id="char-count">0</strong> characters</span>
        </div>
        
        <div class="footer-actions">
          <button class="btn btn-secondary" id="export-txt-btn" title="Export this entry as a text file">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
            Save as Text file
          </button>
          <button class="btn btn-danger-outline" id="delete-entry-btn" title="Delete this entry forever">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Delete Page
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- Ambient Sound Audio API Synthesizer Fallback alert modal or tips (if browser doesn't support Web Audio API) -->
  <div class="toast" id="toast-message">Draft saved!</div>

  <script src="script.js"></script>
</body>
</html>
